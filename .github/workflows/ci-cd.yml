name: CI/CD Build and Update GitOps

on:
  push:
    branches:
      - main

env:
  GITOPS_PATH: k8s/demo-app/deployment.yaml

jobs:
  build-push-update-gitops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set image tag
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/w8-w9-demo-backend:${{ env.IMAGE_TAG }} ./app/backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/w8-w9-demo-backend:${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/w8-w9-demo-frontend:${{ env.IMAGE_TAG }} -f ./app/frontend/Dockerfile ./app
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/w8-w9-demo-frontend:${{ env.IMAGE_TAG }}

      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ngoNguyenTruongAn/w8-w9-gitops-repo
          ref: main
          token: ${{ secrets.GITOPS_REPO_PAT }}
          path: gitops

      - name: Update image tags in GitOps repo
        run: |
          cd gitops

          sed -i "s|image: .*w8-w9-demo-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/w8-w9-demo-backend:${{ env.IMAGE_TAG }}|g" ${{ env.GITOPS_PATH }}
          sed -i "s|image: .*w8-w9-demo-frontend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/w8-w9-demo-frontend:${{ env.IMAGE_TAG }}|g" ${{ env.GITOPS_PATH }}


          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add ${{ env.GITOPS_PATH }}
          git commit -m "chore: update demo-app images tag to ${{ env.IMAGE_TAG }}" || echo "No changes to commit"
          git push