name: validate

on:
  pull_request:
    branches:
      - main
    paths:
      - "k8s/**"
      - "argocd/**"
      - ".github/workflows/validate.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Validate Kubernetes manifests with kubectl kustomize
        run: |
          kubectl kustomize k8s/demo-app

      